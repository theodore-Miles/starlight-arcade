<body>

<meta name="claude:viewport-fit-sides" content="cover">

<style>
:root {

--cyan: #3ff0ff;

--body: "Chakra Petch", ui-sans-serif, system-ui, sans-serif;
}
html, body { height: 100%; }

#view { position: fixed; inset: 0; display: block; width: 100%; height: 100%; outline: none; }
.hud { position: fixed; z-index: 5; pointer-events: none; }

.brand { font-family: var(--display); font-size: 20px; letter-spacing: 0.04em; color: var(--gold); text-shadow: 0 0 12px rgba(255, 210, 63, 0.55); line-height: 1; }
.status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.on { background: #4dff9a; box-shadow: 0 0 8px #4dff9a; }

#roster h2 { font-family: var(--display); font-size: 12px; font-weight: 400; letter-spacing: 0.08em; color: var(--cyan); margin: 0 0 6px; }
#roster ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; max-height: 40vh; overflow: auto; }
#roster li { display: flex; align-items: center; gap: 8px; min-width: 0; }
#roster li span.n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#roster li .tag { font-size: 10px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; margin-left: auto; }
#roster button { margin-top: 8px; width: 100%; font: 600 12px var(--body); color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 5px; cursor: pointer; }

#help { bottom: calc(14px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--muted); white-space: nowrap; }
#help b { color: var(--ink); font-weight: 600; }
#nearby { bottom: calc(56px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); text-align: center; font-size: 13px; }
#nearby .g { font-family: var(--display); color: var(--pink); font-size: 15px; display: block; }
.labels { position: fixed; inset: 0; pointer-events: none; z-index: 4; overflow: hidden; }
.tagname { position: absolute; transform: translate(-50%, -100%); font: 600 12px var(--body); padding: 2px 8px; border-radius: 999px; background: rgba(12, 10, 29, 0.75); border: 1px solid var(--line); white-space: nowrap; }
.tagname .bubble { display: block; text-align: center; font-family: var(--display); color: var(--gold); font-size: 13px; }
.tagname.bot { color: var(--muted); font-weight: 400; }
#start { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(8, 6, 22, 0.6); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 24px; width: min(380px, 100%); display: flex; flex-direction: column; gap: 14px; box-shadow: 0 0 60px rgba(255, 79, 168, 0.18); }
.card h1 { font-family: var(--display); font-weight: 400; font-size: 32px; line-height: 1; margin: 0; color: var(--gold); text-shadow: 0 0 18px rgba(255, 210, 63, 0.5), 3px 3px 0 var(--pink); text-wrap: balance; }
.card p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
.card label { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--cyan); }
#nameInput { width: 100%; box-sizing: border-box; font: 600 16px var(--body); color: var(--ink); background: rgba(0, 0, 0, 0.35); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }

.btn { font: 400 18px var(--display); letter-spacing: 0.04em; color: var(--night); background: var(--gold); border: none; border-radius: 10px; padding: 12px; cursor: pointer; box-shadow: 0 4px 0 #b8901a; }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #b8901a; }
.field { display: flex; flex-direction: column; gap: 6px; }
#stick { position: fixed; z-index: 6; left: max(24px, env(safe-area-inset-left, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); width: 120px; height: 120px; border-radius: 50%; border: 2px solid var(--line); background: rgba(18, 14, 42, 0.5); }

.touchBtns { position: fixed; z-index: 6; right: max(24px, env(safe-area-inset-right, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 12px; }

#ticketCount { font-family: var(--display); font-size: 20px; color: var(--pink); font-variant-numeric: tabular-nums; text-shadow: 0 0 10px rgba(255, 79, 168, 0.5); }

#nearby .go { display: block; color: var(--gold); font-weight: 600; margin-top: 2px; }
#play { position: fixed; inset: 0; z-index: 12; display: grid; place-items: center; background: rgba(8, 6, 22, 0.8); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.playcard { display: flex; flex-direction: column; gap: 10px; width: min(680px, 100%); background: #15102e; border: 2px solid var(--line); border-radius: 18px; padding: 14px; box-sizing: border-box; box-shadow: 0 0 60px rgba(63, 240, 255, 0.15); }

.ptitle { font-family: var(--display); color: var(--gold); font-size: 18px; }
#playScore { margin-left: auto; font-size: 14px; font-variant-numeric: tabular-nums; }
#playExit { font: 600 13px var(--body); color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
#game { display: block; align-self: center; width: min(100%, calc((100vh - 260px) * 4 / 3)); max-width: 100%; aspect-ratio: 4 / 3; image-rendering: pixelated; background: #05030f; border-radius: 8px; touch-action: none; }
.playhelp { font-size: 12px; color: var(--muted); text-align: center; }

.dpad { display: grid; grid-template-areas: ". u ." "l . r" ". d ."; grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(3, 44px); gap: 4px; }

.touchBtns .playBtn { background: var(--gold); color: var(--night); border-color: var(--gold); }

</div>
</div>
</div>
<div id="ext" hidden>
<div class="extbar">
<span class="ptitle" id="extTitle"></span>
<a id="extFull" href="#" target="_blank" rel="noopener">Open in new tab</a>

</div>

</div>
<div id="start">

<div class="field">
<label>Your color</label>
<div class="swatches" id="swatches"></div>
</div>
<button class="btn" type="submit">Enter the arcade</button>
</form>
</div>

holes.forEach(h => { if (h.up > 0) h.up -= dt; if (h.bonked > 0) h.bonked -= dt; });
let hit = -1;
if (edge("a")) hit = this.cur;
if (tap) holes.forEach((h, i) => { if (Math.abs(tap.x - h.x) < 46 && Math.abs(tap.y - h.y) < 32) hit = i; });
if (digit >= 0) hit = digit;
if (hit >= 0) {
this.cur = hit; const h = holes[hit];
if (h.up > 0 && h.bonked <= 0) { h.bonked = 0.35; h.up = 0.35; this.score += 10; } else this.score = Math.max(0, this.score - 2);
}
},
draw() {
bg("#10301a");
holes.forEach((h, i) => {
gx.fillStyle = "#05030f"; gx.beginPath(); gx.ellipse(h.x, h.y + 12, 34, 11, 0, 0, 7); gx.fill();
if (h.up > 0) {
const b = h.bonked > 0;
gx.fillStyle = b ? "#ff8a3d" : "#c9884a"; gx.beginPath(); gx.arc(h.x, h.y, 18, Math.PI, 0); gx.fill(); gx.fillRect(h.x - 18, h.y, 36, 10);
if (b) txt("X  X", h.x, h.y - 6, 9, "#05030f", "center");
else { gx.fillStyle = "#05030f"; gx.fillRect(h.x - 8, h.y - 8, 4, 4); gx.fillRect(h.x + 4, h.y - 8, 4, 4); }
gx.fillStyle = "#ff4fa8"; gx.fillRect(h.x - 3, h.y - 1, 6, 4);
}
if (i === this.cur) { gx.strokeStyle = "#ffd23f"; gx.lineWidth = 2; gx.strokeRect(h.x - 42, h.y - 28, 84, 52); }
});
},
};
},
road() {
const lanes = [100, 160, 220];
return {
score: 0, over: false, lane: 1, x: 160, cars: [], v: 140, spawn: 1, off: 0,
info() { return Math.round(this.v) + " km/h"; },
update(dt) {
if (edge("l") && this.lane > 0) this.lane--; if (edge("r") && this.lane < 2) this.lane++;
this.x += (lanes[this.lane] - this.x) * Math.min(1, dt * 14);
this.v += dt * 4; this.off = (this.off + this.v * dt) % 40; this.score += this.v * dt / 20;
this.spawn -= dt;
if (this.spawn <= 0) { this.cars.push({ x: lanes[Math.floor(Math.random() * 3)], y: -30, c: ["#ff4fa8", "#ffd23f", "#7cff6b", "#ff8a3d"][Math.floor(Math.random() * 4)] }); this.spawn = Math.max(0.35, rand(0.6, 1.1) - this.v / 600); }
this.cars.forEach(c => c.y += this.v * 0.8 * dt); this.cars = this.cars.filter(c => c.y < GH + 40);
for (const c of this.cars) if (Math.abs(c.x - this.x) < 22 && Math.abs(c.y - (GH - 40)) < 34) this.over = true;
},
draw() {
bg("#1a0f33"); gx.fillStyle = "#120a24"; gx.fillRect(70, 0, 180, GH);
gx.fillStyle = "#b388ff"; gx.fillRect(68, 0, 3, GH); gx.fillRect(249, 0, 3, GH);
gx.fillStyle = "#3a2a6a"; for (let y = -40 + this.off; y < GH; y += 40) { gx.fillRect(129, y, 2, 20); gx.fillRect(189, y, 2, 20); }
this.cars.forEach(c => car(c.x, c.y, c.c)); car(this.x, GH - 40, "#3ff0ff");
},
};
},
snake() {
const CW = 20, CH = 15, S = 16;

score: 0, over: false, body: [{ x: 10, y: 7 }, { x: 9, y: 7 }, { x: 8, y: 7 }], dir: { x: 1, y: 0 }, q: [], acc: 0, step: 0.12, food: null,

update(dt) {

this.acc -= this.step; if (this.q.length) this.dir = this.q.shift();
const h = { x: this.body[0].x + this.dir.x, y: this.body[0].y + this.dir.y };

this.body.unshift(h);
if (h.x === this.food.x && h.y === this.food.y) { this.score += 10; this.step = Math.max(0.06, this.step * 0.97); this.place(); } else this.body.pop();
}
},
draw() {
bg(); gx.strokeStyle = "#16112e"; gx.lineWidth = 1;
for (let x = 0; x <= CW; x++) { gx.beginPath(); gx.moveTo(x * S, 0); gx.lineTo(x * S, GH); gx.stroke(); }
for (let y = 0; y <= CH; y++) { gx.beginPath(); gx.moveTo(0, y * S); gx.lineTo(GW, y * S); gx.stroke(); }
gx.fillStyle = "#ff4fa8"; gx.fillRect(this.food.x * S + 3, this.food.y * S + 3, S - 6, S - 6);
this.body.forEach((b, i) => { gx.fillStyle = i ? "#ffd23f" : "#fff"; gx.fillRect(b.x * S + 1, b.y * S + 1, S - 2, S - 2); });
},
};
s.place(); return s;
},
rocks() {
return {
score: 0, over: false, x: GW / 2, t: 0, rocks: [], gems: [],
info() { return "Dodge!"; },
update(dt) {
this.t += dt; this.score += dt * 5; this.x = clamp(this.x + axis() * 200 * dt, 10, GW - 10);
if (Math.random() < dt * (1.5 + this.t / 8)) this.rocks.push({ x: rand(0, GW), y: -12, r: rand(6, 14), v: rand(70, 120) + this.t * 3, a: 0, s: rand(-3, 3) });
if (Math.random() < dt * 0.5) this.gems.push({ x: rand(10, GW - 10), y: -8, v: 90 });
const py = GH - 18;
this.rocks.forEach(r => { r.y += r.v * dt; r.a += r.s * dt; if (Math.hypot(r.x - this.x, r.y - py) < r.r + 6) this.over = true; });
this.gems.forEach(g => { g.y += g.v * dt; if (Math.hypot(g.x - this.x, g.y - py) < 14) { g.dead = true; this.score += 25; } });
this.rocks = this.rocks.filter(r => r.y < GH + 20); this.gems = this.gems.filter(g => !g.dead && g.y < GH + 10);
},
draw() {
bg(); gx.strokeStyle = "#ff8a3d"; gx.lineWidth = 2;
this.rocks.forEach(r => { gx.beginPath(); for (let k = 0; k < 7; k++) { const a = k / 7 * 6.283 + r.a, rr = r.r * (0.8 + (k % 3) * 0.12); gx.lineTo(r.x + Math.cos(a) * rr, r.y + Math.sin(a) * rr); } gx.closePath(); gx.stroke(); });
gx.fillStyle = "#3ff0ff"; this.gems.forEach(g => { gx.beginPath(); gx.moveTo(g.x, g.y - 6); gx.lineTo(g.x + 5, g.y); gx.lineTo(g.x, g.y + 6); gx.lineTo(g.x - 5, g.y); gx.fill(); });
gx.fillStyle = "#7cff6b"; gx.fillRect(this.x - 7, GH - 26, 14, 14); gx.fillStyle = "#05030f"; gx.fillRect(this.x - 4, GH - 22, 3, 3); gx.fillRect(this.x + 1, GH - 22, 3, 3);
},
};
},
};
const play = { open: false, cab: null, g: null, phase: "ready", t: 0, earned: 0, best: 0, newBest: false };
let tickets = parseInt(store("sa_tickets") || "0", 10) || 0;
const ticketEl = document.getElementById("ticketCount");
function renderTickets(bump) {
ticketEl.textContent = String(tickets).padStart(4, "0");
if (bump) { ticketEl.classList.remove("bump"); void ticketEl.offsetWidth; ticketEl.classList.add("bump"); }
}
renderTickets();
function resetInput() { for (const k in inp) { inp[k] = false; prev[k] = false; } tap = null; digit = -1; aim = null; }
function newRound() { play.g = MAKERS[play.cab.game.type](); play.phase = "ready"; play.t = 1.1; resetInput(); }
const extEl = document.getElementById("ext"), extFrame = document.getElementById("extFrame");
function openGame(cab) {
for (const k in keys) keys[k] = false;
if (cab.game.type === "ext") {
play.open = true; play.cab = cab; play.ext = true;
document.getElementById("extTitle").textContent = cab.game.name;
document.getElementById("extFull").href = cab.game.src;
extFrame.src = cab.game.src; extEl.hidden = false;
extFrame.onload = () => { try { extFrame.focus(); } catch (e) {} };
return;
}
play.open = true; play.cab = cab; playEl.hidden = false;
playTitle.textContent = cab.game.name; playHelp.textContent = HELP[cab.game.type];
document.getElementById("pads").hidden = !isTouch;
newRound();
}
function closeGame() {
if (play.ext) { play.ext = false; extEl.hidden = true; extFrame.removeAttribute("src"); extFrame.src = "about:blank"; }
play.open = false; playEl.hidden = true; resetInput(); lastSent = ""; nearCab = null; canvas.focus(); }
document.getElementById("playExit").onclick = closeGame;
document.getElementById("extExit").onclick = closeGame;
window.__arcadeExit = () => { if (play.ext) closeGame(); };
addEventListener("message", e => { if (play.ext && e.source === extFrame.contentWindow && e.data && e.data.arcade === "exit") closeGame(); });
document.addEventListener("fullscreenchange", () => { if (play.ext && !document.fullscreenElement) canvas.blur(); });
gameCanvas.addEventListener("pointerdown", e => {
const r = gameCanvas.getBoundingClientRect();
tap = { x: (e.clientX - r.left) / r.width * GW, y: (e.clientY - r.top) / r.height * GH };
aim = { x: tap.x, y: tap.y };
if (play.cab && play.cab.game.type !== "moles" && !(play.cab.game.type === "hockey" && play.phase !== "over")) inp.a = true;
});
gameCanvas.addEventListener("pointermove", e => {
const r = gameCanvas.getBoundingClientRect();
aim = { x: (e.clientX - r.left) / r.width * GW, y: (e.clientY - r.top) / r.height * GH };
});
gameCanvas.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") aim = null; });
const releaseA = () => { inp.a = false; };
gameCanvas.addEventListener("pointerup", releaseA); gameCanvas.addEventListener("pointercancel", releaseA);
document.querySelectorAll("#pads [data-k]").forEach(b => {
const k = b.dataset.k;
b.addEventListener("pointerdown", e => { e.preventDefault(); inp[k] = true; });
["pointerup", "pointercancel", "pointerleave"].forEach(ev => b.addEventListener(ev, () => { inp[k] = false; }));
});
function stepGame(dt) {
const g = play.g;
if (play.phase === "ready") { play.t -= dt; if (play.t <= 0) play.phase = "play"; }
else if (play.phase === "play") {
g.update(dt);
if (g.over) {
play.phase = "over"; play.t = 0.8;
const sc = Math.floor(g.score), key = "sa_best_" + play.cab.game.type;
play.earned = Math.max(1, Math.floor(sc / 20)); tickets += play.earned; store("sa_tickets", String(tickets)); renderTickets(true);
const b = parseInt(store(key) || "0", 10) || 0; play.newBest = sc > b; play.best = Math.max(b, sc); if (play.newBest) store(key, String(sc));
}
} else { play.t -= dt; if (play.t <= 0 && edge("a")) { newRound(); } }
Object.assign(prev, inp); tap = null; digit = -1;
const cur = play.g;
cur.draw();
if (play.phase === "ready") { gx.fillStyle = "rgba(5,3,15,0.55)"; gx.fillRect(0, 0, GW, GH); txt("READY!", GW / 2, GH / 2, 30, "#ffd23f", "center"); }
if (play.phase === "over") {
gx.fillStyle = "rgba(5,3,15,0.78)"; gx.fillRect(0, 0, GW, GH);
txt("GAME OVER", GW / 2, 62, 30, "#ff4fa8", "center");
txt("SCORE " + Math.floor(cur.score), GW / 2, 104, 16, "#efeaff", "center");
txt("+" + play.earned + " TICKETS", GW / 2, 132, 16, "#ffd23f", "center");
if (cur.result) txt(cur.result, GW / 2, 160, 13, "#3ff0ff", "center");
if (play.t <= 0) txt(isTouch ? "TAP A TO PLAY AGAIN" : "SPACE TO PLAY AGAIN · ESC TO LEAVE", GW / 2, 200, 10, "#a49cc9", "center");
}
playScore.textContent = "Score " + Math.floor(cur.score) + " · " + cur.info();
}
let last = performance.now(), screenClock = 0;
function frame(now) {
const dt = Math.min(0.05, (now - last) / 1000); last = now;
const t = now / 1000;
if (started) {
let fx = 0, fz = 0;
if (keys.KeyW || keys.ArrowUp) fz -= 1; if (keys.KeyS || keys.ArrowDown) fz += 1;
if (keys.KeyA || keys.ArrowLeft) fx -= 1; if (keys.KeyD || keys.ArrowRight) fx += 1;
fx += joy.x; fz += joy.y;
if (play.open) { fx = 0; fz = 0; }
const L = Math.hypot(fx, fz);
const run = keys.ShiftLeft || keys.ShiftRight || Math.hypot(joy.x, joy.y) > 0.95;
const sp = (run ? 8 : 4.6) * Math.min(1, L);
if (L > 0.05) {
const nx = fx / L, nz = fz / L;
const wx = nx * Math.cos(yaw) + nz * Math.sin(yaw), wz = -nx * Math.sin(yaw) + nz * Math.cos(yaw);
const ox = me.x, oz = me.z;
moveWithCollide(me, wx * sp * dt, wz * sp * dt);
me.speed = Math.hypot(me.x - ox, me.z - oz) / dt;
me.ry = lerpAngle(me.ry, Math.atan2(wx, wz), 1 - Math.exp(-14 * dt));
} else me.speed = 0;
me.vy -= 18 * dt; me.y = Math.max(0, me.y + me.vy * dt); if (me.y === 0) me.vy = 0;
poseAvatar(myAvatar, me.x, me.y, me.z, me.ry, me.speed, Date.now() < me.waveUntil, dt);
placeTag(myTag, me.x, me.y, me.z, myName, myColor, Date.now() < me.waveUntil ? "HI!" : "");
sendPresence(now);
if (play.open) { if (!play.ext) stepGame(dt); } else checkNearby();
} else {
yaw += dt * 0.12;
}
updateBots(dt);
updateOthers(dt);
screenClock += dt;
if (screenClock > 1 / 15) { screenClock = 0; for (const c of cabinets) drawScreen(c, t); }
const dist = 6.2, hx = me.x, hy = me.y + 1.6, hz = me.z;
camera.position.set(hx + Math.sin(yaw) * Math.cos(pitch) * dist, hy + Math.sin(pitch) * dist, hz + Math.cos(yaw) * Math.cos(pitch) * dist);
camera.position.x = Math.max(-RW / 2 + 0.4, Math.min(RW / 2 - 0.4, camera.position.x));
camera.position.z = Math.max(-RD / 2 + 0.4, Math.min(RD / 2 - 0.4, camera.position.z));
camera.position.y = Math.min(RH - 0.3, camera.position.y);
camera.lookAt(hx, hy, hz);
renderer.render(scene, camera);
requestAnimationFrame(frame);
}
function start(saved) {
if (saved && Number.isFinite(saved.x)) { me.x = saved.x; me.z = saved.z; yaw = saved.yaw || 0; }
setBots(botsOn);
connect();
requestAnimationFrame(frame);
if (saved && saved.started) enter(saved.name, saved.color);
}
function enter(name, color) {
myName = cleanStr(name, 16).trim() || myName; myColor = okColor(color || myColor);
store("sa_name", myName); store("sa_color", myColor);
if (myAvatar) removeAvatar(myAvatar);
myAvatar = makeAvatar(myColor); if (!myTag) myTag = makeTag();
document.getElementById("start").hidden = true;
if (isTouch) { stickEl.hidden = false; document.getElementById("touchBtns").hidden = false; }
started = true; if (!(Math.abs(yaw) > 0) ) yaw = 0; canvas.focus();
renderRoster();
}
document.getElementById("startForm").addEventListener("submit", e => { e.preventDefault(); enter(nameInput.value, myColor); });
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) { try { hot.snapshot(() => ({ x: me.x, z: me.z, yaw, started, name: myName, color: myColor })); } catch (e) {} }
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
